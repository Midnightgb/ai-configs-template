# formula = "jq"
# version = "1.7"

# Cargo crates, exact version.
# [deps.cargo]
# ripgrep = "14.1.1"

# Global npm packages, exact version.
# [deps.npm]
# "@anthropic-ai/claude-code" = "2.1.0"

# herdr plugins from GitHub, pinned by tag or commit.
# [[deps.herdr_plugins]]
# source = "owner/repo/subdir"
# ref = "v1.0.0"
